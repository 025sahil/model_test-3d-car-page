<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sable GT — 3D feature tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@340;480;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #090b10;
      --panel: rgba(12, 15, 22, 0.78);
      --line: rgba(255, 255, 255, 0.1);
      --text: #e8edf5;
      --muted: #9aa3b5;
      --accent: #e7b15a;
      --accent-ink: #1a1408;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Outfit, sans-serif; }
    #app { position: relative; height: 100%; overflow: hidden; }
    canvas { display: block; }
    #labels { position: absolute; inset: 0; pointer-events: none; }
    .tag {
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px;
      border-radius: 999px;
      background: rgba(9, 11, 16, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #f4f7fb;
      font-size: 12px;
      letter-spacing: 0.02em;
      backdrop-filter: blur(8px);
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }
    .tag .lbl { display: none; padding-right: 8px; }
    .tag .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(231, 177, 90, 0.2);
    }
    .tag.active {
      padding: 4px 10px 4px 4px;
      background: var(--accent);
      color: var(--accent-ink);
      border-color: transparent;
      transform: translate(6px, -50%);
    }
    .tag.active .lbl { display: inline; }
    .tag.active .dot { background: var(--accent-ink); box-shadow: none; }
    header.brand {
      position: absolute; top: 28px; left: 32px; z-index: 2;
      pointer-events: none;
    }
    header.brand .mark {
      font-family: Syne, sans-serif;
      font-weight: 800;
      letter-spacing: 0.22em;
      font-size: 13px;
      color: var(--accent);
    }
    header.brand h1 {
      margin: 6px 0 0;
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: 42px;
      line-height: 0.95;
      letter-spacing: -0.03em;
    }
    header.brand p {
      margin: 10px 0 0;
      max-width: 280px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }
    aside.panel {
      position: absolute; top: 24px; right: 24px; bottom: 24px;
      width: min(340px, calc(100vw - 48px));
      z-index: 2;
      display: flex; flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      backdrop-filter: blur(16px);
      overflow: hidden;
    }
    .panel header {
      padding: 20px 20px 12px;
      border-bottom: 1px solid var(--line);
    }
    .panel header h2 {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .panel header strong {
      display: block;
      margin-top: 6px;
      font-family: Syne, sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      text-transform: none;
    }
    ul.features {
      list-style: none;
      margin: 0; padding: 10px;
      overflow: auto;
      flex: 1;
    }
    ul.features button {
      width: 100%;
      text-align: left;
      background: transparent;
      color: inherit;
      border: 1px solid transparent;
      border-radius: 14px;
      padding: 12px 12px 12px 14px;
      cursor: pointer;
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 4px 10px;
      font: inherit;
    }
    ul.features button:hover { background: rgba(255,255,255,0.04); }
    ul.features button.active {
      background: rgba(231, 177, 90, 0.1);
      border-color: rgba(231, 177, 90, 0.35);
    }
    ul.features .idx {
      grid-row: span 2;
      align-self: center;
      font-family: Syne, sans-serif;
      color: var(--accent);
      font-size: 13px;
    }
    ul.features .name { font-weight: 600; font-size: 15px; }
    ul.features .blurb { color: var(--muted); font-size: 13px; line-height: 1.35; }
    .detail {
      padding: 16px 18px 18px;
      border-top: 1px solid var(--line);
    }
    .detail h3 { margin: 0 0 6px; font-size: 16px; }
    .detail p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .actions button, .hint kbd {
      font-family: inherit;
    }
    .actions button {
      border: 0;
      background: var(--accent);
      color: var(--accent-ink);
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .actions button.ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }
    .hint {
      position: absolute; left: 32px; bottom: 24px; z-index: 2;
      color: var(--muted); font-size: 13px;
    }
    .hint kbd {
      display: inline-block;
      padding: 1px 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      background: rgba(255,255,255,0.04);
    }
    #status {
      position: absolute; inset: 0; display: grid; place-items: center;
      z-index: 3; background: var(--bg); color: var(--muted);
    }
    @media (max-width: 860px) {
      header.brand { top: 16px; left: 16px; }
      header.brand h1 { font-size: 30px; }
      header.brand p { display: none; }
      aside.panel {
        top: auto; left: 12px; right: 12px; bottom: 12px;
        width: auto; max-height: 42vh;
      }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="status">Loading the showroom…</div>
    <header class="brand">
      <div class="mark">SABLE</div>
      <h1>GT Coupé</h1>
      <p>Drag to look around the car. Pick a feature to move in close and try it.</p>
    </header>
    <aside class="panel">
      <header>
        <h2>Feature tour</h2>
        <strong id="feature-title">Sculpted shell</strong>
      </header>
      <ul class="features" id="feature-list"></ul>
      <div class="detail">
        <h3 id="detail-name">Sculpted shell</h3>
        <p id="detail-copy"></p>
        <div class="actions" id="detail-actions"></div>
      </div>
    </aside>
    <div class="hint"><kbd>drag</kbd> orbit &nbsp; <kbd>scroll</kbd> zoom &nbsp; <kbd>1–8</kbd> features</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

    const FEATURES = [
      {
        id: "body",
        name: "Sculpted shell",
        blurb: "One continuous skin, long hood, low beltline.",
        copy: "The body is a single painted shell: a long hood, a short rear deck, and shoulders that flare over the wheels. Clearcoat keeps the reflections tight.",
        view: { pos: [4.4, 1.85, 4.6], look: [-0.15, 0.72, 0.1] },
        anchor: [1.05, 0.78, 0.35],
      },
      {
        id: "glass",
        name: "Glasshouse",
        blurb: "Raked windshield and a dark cabin.",
        copy: "The glasshouse sits back over the rear half of the car. A steep windshield and a short roof keep the silhouette low, and the seats show through the glass.",
        view: { pos: [2.5, 1.65, 2.5], look: [0, 1.12, -0.15] },
        anchor: [0.15, 1.48, 0.05],
      },
      {
        id: "lights",
        name: "LED headlights",
        blurb: "Twin lamps you can switch on.",
        copy: "Each lamp is a slim housing with an amber daytime strip underneath. Switch them on to light the nose.",
        view: { pos: [1.8, 0.95, 3.7], look: [0, 0.62, 1.85] },
        anchor: [0.62, 0.66, 2.2],
        action: { id: "lights", labelOn: "Turn lights on", labelOff: "Turn lights off" },
      },
      {
        id: "wheels",
        name: "Forged alloys",
        blurb: "Open five-spoke wheels and painted calipers.",
        copy: "The wheels sit in open arches cut out of the body: a round tire, five spokes, and a gold caliper. They roll slowly while you look around.",
        view: { pos: [2.55, 0.62, 2.15], look: [0.9, 0.36, 1.28] },
        anchor: [1.12, 0.36, 1.28],
      },
      {
        id: "doors",
        name: "Cabin doors",
        blurb: "Hinged panels that swing out.",
        copy: "Each door is its own panel on a front hinge, with a window and a pull. Open them and the panel swings clear of the shell.",
        view: { pos: [3.15, 1.25, 1.35], look: [0.35, 0.9, 0.05] },
        anchor: [1.12, 1.02, 0.05],
        action: { id: "doors", labelOn: "Open doors", labelOff: "Close doors" },
      },
      {
        id: "spoiler",
        name: "Rear wing",
        blurb: "A raised blade on two struts.",
        copy: "The wing sits above the rear deck on two struts, in line with the black diffuser under the bumper.",
        view: { pos: [-1.6, 1.55, -3.9], look: [0, 1.0, -1.45] },
        anchor: [0, 1.32, -1.72],
      },
      {
        id: "exhaust",
        name: "Dual exhaust",
        blurb: "Two polished outlets in the diffuser.",
        copy: "Two round outlets sit low in the rear diffuser, finished in metal so they catch the rim light.",
        view: { pos: [1.35, 0.48, -3.55], look: [0.28, 0.32, -2.05] },
        anchor: [0.38, 0.3, -2.18],
      },
      {
        id: "mirrors",
        name: "Aero mirrors",
        blurb: "Stalk-mounted housings on the beltline.",
        copy: "The mirrors stand off the doors on short stalks. Their housings use the same paint as the body, with a dark glass face.",
        view: { pos: [2.45, 1.4, 1.55], look: [0.9, 1.08, 0.42] },
        anchor: [1.22, 1.16, 0.48],
      },
    ];

    const app = document.getElementById("app");
    const statusEl = document.getElementById("status");
    const listEl = document.getElementById("feature-list");
    const titleEl = document.getElementById("feature-title");
    const detailName = document.getElementById("detail-name");
    const detailCopy = document.getElementById("detail-copy");
    const detailActions = document.getElementById("detail-actions");

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    app.prepend(renderer.domElement);

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.id = "labels";
    app.appendChild(labelRenderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0c1016);
    scene.fog = new THREE.Fog(0x0c1016, 14, 28);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.05).texture;

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 80);
    camera.position.set(4.6, 1.85, 5.0);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(-0.2, 0.72, 0.1);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 2.4;
    controls.maxDistance = 11;
    controls.maxPolarAngle = Math.PI / 2.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.65;

    const groups = {};
    const wheels = [];
    let doorsOpen = false;
    let lightsOn = true;
    let selected = FEATURES[0].id;
    const camAnim = { active: false, t: 0, from: new THREE.Vector3(), to: new THREE.Vector3(), lookFrom: new THREE.Vector3(), lookTo: new THREE.Vector3() };
    function paintMaterial() {
      const mat = new THREE.MeshPhysicalMaterial({
        color: 0x8e1c28,
        metalness: 0.45,
        roughness: 0.42,
        clearcoat: 1,
        clearcoatRoughness: 0.12,
        envMapIntensity: 1,
      });
      mat.userData.feature = true;
      mat.userData.baseEmissive = 0;
      return mat;
    }
    const trimMat = new THREE.MeshStandardMaterial({ color: 0x14161c, roughness: 0.55, metalness: 0.4 });
    const glassMat = new THREE.MeshPhysicalMaterial({
      color: 0x0d1520,
      metalness: 0.1,
      roughness: 0.04,
      transparent: true,
      opacity: 0.72,
      envMapIntensity: 1.4,
    });
    const metalMat = new THREE.MeshStandardMaterial({ color: 0xc5ccd6, metalness: 0.95, roughness: 0.25 });
    const tireMat = new THREE.MeshStandardMaterial({ color: 0x1a1c20, roughness: 0.85, metalness: 0.05 });
    const caliperMat = new THREE.MeshStandardMaterial({ color: 0xd7a441, metalness: 0.6, roughness: 0.35 });
    const lampMat = new THREE.MeshStandardMaterial({
      color: 0xf4f7ff,
      emissive: 0xfff1d2,
      emissiveIntensity: 2.2,
      roughness: 0.25,
    });
    const amberMat = new THREE.MeshStandardMaterial({
      color: 0xffb24a,
      emissive: 0xff8a1e,
      emissiveIntensity: 1.4,
      roughness: 0.35,
    });
    const tailMat = new THREE.MeshStandardMaterial({
      color: 0xff2a2a,
      emissive: 0xff1c1c,
      emissiveIntensity: 1.1,
      roughness: 0.4,
    });
    const darkGlass = new THREE.MeshStandardMaterial({ color: 0x0a0c10, roughness: 0.15, metalness: 0.6 });

    function addMesh(parent, geometry, material, x, y, z, rot) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      if (rot) mesh.rotation.set(rot[0] || 0, rot[1] || 0, rot[2] || 0);
      parent.add(mesh);
      return mesh;
    }

    function makeWheel() {
      const spin = new THREE.Group();
      const tire = new THREE.Mesh(new THREE.TorusGeometry(0.33, 0.09, 18, 36), tireMat);
      tire.rotation.y = Math.PI / 2;
      tire.castShadow = true;
      spin.add(tire);
      const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.21, 0.21, 0.14, 28), metalMat);
      rim.rotation.z = Math.PI / 2;
      rim.castShadow = true;
      spin.add(rim);
      for (let i = 0; i < 5; i++) {
        const spoke = new THREE.Mesh(new RoundedBoxGeometry(0.045, 0.18, 0.05, 1, 0.01), metalMat);
        spoke.position.y = 0.09;
        const pivot = new THREE.Group();
        pivot.rotation.x = (i / 5) * Math.PI * 2;
        pivot.add(spoke);
        spin.add(pivot);
      }
      const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.03, 20), trimMat);
      disc.rotation.z = Math.PI / 2;
      spin.add(disc);
      const caliper = new THREE.Mesh(new RoundedBoxGeometry(0.05, 0.09, 0.07, 1, 0.01), caliperMat);
      caliper.position.set(0.02, 0.11, 0);
      spin.add(caliper);
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.03, 16), trimMat);
      cap.rotation.z = Math.PI / 2;
      cap.position.x = 0.08;
      spin.add(cap);
      return spin;
    }

    function extrudeProfile(shape, width, material) {
      const geo = new THREE.ExtrudeGeometry(shape, {
        depth: width,
        bevelEnabled: true,
        bevelThickness: 0.035,
        bevelSize: 0.05,
        bevelSegments: 2,
        curveSegments: 20,
      });
      geo.computeBoundingBox();
      const box = geo.boundingBox;
      geo.translate(0, 0, -((box.min.z + box.max.z) / 2));
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, material);
      mesh.rotation.y = -Math.PI / 2;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function bodyProfile() {
      const s = new THREE.Shape();
      s.moveTo(-2.08, 0.32);
      s.lineTo(-2.08, 0.7);
      s.quadraticCurveTo(-1.85, 0.9, -1.35, 0.9);
      s.lineTo(0.45, 0.92);
      s.quadraticCurveTo(1.25, 0.9, 1.85, 0.74);
      s.quadraticCurveTo(2.18, 0.64, 2.16, 0.46);
      s.lineTo(2.08, 0.32);
      s.lineTo(1.76, 0.32);
      s.absarc(1.28, 0.36, 0.48, 0, Math.PI, false);
      s.lineTo(-0.84, 0.32);
      s.absarc(-1.32, 0.36, 0.48, 0, Math.PI, false);
      s.lineTo(-2.08, 0.32);
      return s;
    }

    function buildCar() {
      const car = new THREE.Group();

      const body = new THREE.Group();
      groups.body = body;
      body.add(extrudeProfile(bodyProfile(), 1.72, paintMaterial()));
      addMesh(body, new RoundedBoxGeometry(1.28, 0.42, 3.15, 2, 0.04), trimMat, 0, 0.48, -0.02);
      addMesh(body, new RoundedBoxGeometry(1.62, 0.06, 0.42, 2, 0.02), trimMat, 0, 0.4, 2.12);
      addMesh(body, new RoundedBoxGeometry(1.5, 0.1, 0.36, 2, 0.02), trimMat, 0, 0.36, -2.02);
      car.add(body);

      const glass = new THREE.Group();
      groups.glass = glass;
      const roofMat = paintMaterial();
      addMesh(glass, new RoundedBoxGeometry(1.38, 0.08, 1.05, 3, 0.03), roofMat, 0, 1.34, -0.28);
      const windshield = addMesh(glass, new THREE.BoxGeometry(1.32, 0.58, 0.035), glassMat, 0, 1.12, 0.42);
      windshield.rotation.x = 0.78;
      const rearGlass = addMesh(glass, new THREE.BoxGeometry(1.22, 0.48, 0.035), glassMat, 0, 1.16, -0.92);
      rearGlass.rotation.x = -0.62;
      addMesh(glass, new THREE.BoxGeometry(0.06, 0.42, 0.06), roofMat, 0.62, 1.12, 0.38);
      addMesh(glass, new THREE.BoxGeometry(0.06, 0.42, 0.06), roofMat, -0.62, 1.12, 0.38);
      addMesh(glass, new THREE.BoxGeometry(0.05, 0.36, 0.05), roofMat, 0.6, 1.16, -0.78);
      addMesh(glass, new THREE.BoxGeometry(0.05, 0.36, 0.05), roofMat, -0.6, 1.16, -0.78);
      addMesh(glass, new RoundedBoxGeometry(0.46, 0.22, 0.46, 2, 0.04), trimMat, -0.32, 0.78, -0.05);
      addMesh(glass, new RoundedBoxGeometry(0.46, 0.22, 0.46, 2, 0.04), trimMat, 0.32, 0.78, 0.22);
      const steer = addMesh(glass, new THREE.TorusGeometry(0.14, 0.018, 8, 20), trimMat, -0.42, 0.92, 0.32);
      steer.rotation.y = 0.55;
      steer.rotation.x = 0.7;
      car.add(glass);

      const lights = new THREE.Group();
      groups.lights = lights;
      const headL = addMesh(lights, new RoundedBoxGeometry(0.36, 0.1, 0.07, 2, 0.02), lampMat, 0.55, 0.48, 2.2);
      const headR = addMesh(lights, new RoundedBoxGeometry(0.36, 0.1, 0.07, 2, 0.02), lampMat.clone(), -0.55, 0.48, 2.2);
      addMesh(lights, new RoundedBoxGeometry(0.36, 0.028, 0.03, 1, 0.01), amberMat, 0.55, 0.4, 2.2);
      addMesh(lights, new RoundedBoxGeometry(0.36, 0.028, 0.03, 1, 0.01), amberMat, -0.55, 0.4, 2.2);
      addMesh(lights, new RoundedBoxGeometry(1.45, 0.055, 0.045, 2, 0.012), tailMat, 0, 0.72, -2.1);
      addMesh(lights, new RoundedBoxGeometry(0.62, 0.18, 0.04, 1, 0.01), trimMat, 0, 0.52, 2.18);
      for (let i = 0; i < 4; i++) {
        addMesh(lights, new THREE.BoxGeometry(0.5, 0.012, 0.015), metalMat, 0, 0.46 + i * 0.038, 2.2);
      }
      car.add(lights);
      lights.userData.heads = [headL, headR];

      const wheelGroup = new THREE.Group();
      groups.wheels = wheelGroup;
      [[0.92, 1.28], [-0.92, 1.28], [0.92, -1.32], [-0.92, -1.32]].forEach(([x, z]) => {
        const spin = makeWheel();
        if (x < 0) spin.rotation.y = Math.PI;
        const mount = new THREE.Group();
        mount.position.set(x, 0.36, z);
        mount.add(spin);
        mount.userData.spin = spin;
        wheelGroup.add(mount);
        wheels.push(mount);
      });
      car.add(wheelGroup);

      const doorGroup = new THREE.Group();
      groups.doors = doorGroup;
      function makeDoor(side) {
        const hinge = new THREE.Group();
        hinge.position.set(0.86 * side, 0.7, 0.5);
        addMesh(hinge, new RoundedBoxGeometry(0.045, 0.38, 1.2, 2, 0.015), paintMaterial(), 0.02 * side, 0, -0.6);
        addMesh(hinge, new THREE.BoxGeometry(0.015, 0.26, 0.7), glassMat, 0.05 * side, 0.36, -0.46);
        addMesh(hinge, new RoundedBoxGeometry(0.02, 0.028, 0.11, 1, 0.006), metalMat, 0.05 * side, 0.02, -0.28);
        hinge.userData.side = side;
        return hinge;
      }
      const doorR = makeDoor(1);
      const doorL = makeDoor(-1);
      doorGroup.add(doorR, doorL);
      doorGroup.userData.hinges = [doorR, doorL];
      car.add(doorGroup);

      const mirrors = new THREE.Group();
      groups.mirrors = mirrors;
      [1, -1].forEach((side) => {
        addMesh(mirrors, new THREE.BoxGeometry(0.14, 0.02, 0.035), trimMat, 0.96 * side, 1.08, 0.42);
        addMesh(mirrors, new RoundedBoxGeometry(0.14, 0.09, 0.09, 2, 0.02), paintMaterial(), 1.1 * side, 1.12, 0.4);
        addMesh(mirrors, new THREE.BoxGeometry(0.012, 0.06, 0.06), darkGlass, 1.16 * side, 1.12, 0.4);
      });
      car.add(mirrors);

      const spoiler = new THREE.Group();
      groups.spoiler = spoiler;
      addMesh(spoiler, new RoundedBoxGeometry(1.28, 0.055, 0.26, 2, 0.02), paintMaterial(), 0, 1.22, -1.62);
      addMesh(spoiler, new THREE.BoxGeometry(0.035, 0.2, 0.07), trimMat, 0.38, 1.08, -1.55);
      addMesh(spoiler, new THREE.BoxGeometry(0.035, 0.2, 0.07), trimMat, -0.38, 1.08, -1.55);
      car.add(spoiler);

      const exhaust = new THREE.Group();
      groups.exhaust = exhaust;
      [0.34, -0.34].forEach((x) => {
        const pipe = addMesh(exhaust, new THREE.CylinderGeometry(0.055, 0.065, 0.16, 18), metalMat, x, 0.3, -2.12);
        pipe.rotation.x = Math.PI / 2;
        const ring = addMesh(exhaust, new THREE.TorusGeometry(0.06, 0.01, 8, 18), metalMat, x, 0.3, -2.2);
        ring.rotation.y = Math.PI / 2;
      });
      car.add(exhaust);

      scene.add(car);
      return car;
    }

    function addStudio() {
      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(16, 80),
        new THREE.MeshStandardMaterial({ color: 0x12151c, roughness: 0.92, metalness: 0.08 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      const pad = new THREE.Mesh(
        new THREE.CylinderGeometry(2.7, 2.9, 0.06, 64),
        new THREE.MeshStandardMaterial({ color: 0x191d27, metalness: 0.35, roughness: 0.5 })
      );
      pad.position.y = 0.01;
      pad.receiveShadow = true;
      scene.add(pad);

      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = 256;
      const g = canvas.getContext("2d");
      const grd = g.createRadialGradient(128, 128, 30, 128, 128, 120);
      grd.addColorStop(0, "rgba(0,0,0,0.45)");
      grd.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = grd;
      g.fillRect(0, 0, 256, 256);
      const shadow = new THREE.Mesh(
        new THREE.PlaneGeometry(4.8, 7.2),
        new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true, depthWrite: false })
      );
      shadow.rotation.x = -Math.PI / 2;
      shadow.position.y = 0.045;
      scene.add(shadow);

      const key = new THREE.DirectionalLight(0xfff4e5, 3.2);
      key.position.set(4.5, 7, 3);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.camera.near = 1;
      key.shadow.camera.far = 24;
      key.shadow.camera.left = -6;
      key.shadow.camera.right = 6;
      key.shadow.camera.top = 6;
      key.shadow.camera.bottom = -6;
      scene.add(key);
      scene.add(new THREE.AmbientLight(0x8ea0c4, 0.35));
      const rim = new THREE.DirectionalLight(0x9eb6ff, 1.6);
      rim.position.set(-5, 3, -4);
      scene.add(rim);
      const fill = new THREE.DirectionalLight(0xffe0c2, 0.6);
      fill.position.set(-2, 2, 6);
      scene.add(fill);

      const nose = new THREE.PointLight(0xffe6c2, 0, 4.5, 2);
      nose.position.set(0, 0.62, 2.55);
      scene.add(nose);
      groups.lights.userData.glow = nose;
    }

    function attachLabels(car) {
      FEATURES.forEach((f, i) => {
        const el = document.createElement("button");
        el.className = "tag";
        el.type = "button";
        el.innerHTML = `<span class="dot"></span><span class="lbl">${f.name}</span>`;
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          selectFeature(f.id);
        });
        const obj = new CSS2DObject(el);
        obj.position.set(f.anchor[0], f.anchor[1], f.anchor[2]);
        car.add(obj);
        f.el = el;
      });
    }

    function renderList() {
      listEl.innerHTML = "";
      FEATURES.forEach((f, i) => {
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.dataset.id = f.id;
        btn.innerHTML = `<span class="idx">${String(i + 1).padStart(2, "0")}</span><span class="name">${f.name}</span><span class="blurb">${f.blurb}</span>`;
        btn.addEventListener("click", () => selectFeature(f.id));
        li.appendChild(btn);
        listEl.appendChild(li);
        f.btn = btn;
      });
    }

    function applyLights() {
      const intensity = lightsOn ? 2.4 : 0.15;
      const amber = lightsOn ? 1.5 : 0.2;
      groups.lights.traverse((obj) => {
        if (!obj.isMesh) return;
        if (obj.material === lampMat || groups.lights.userData.heads.includes(obj)) {
          obj.material.emissiveIntensity = intensity;
        }
      });
      groups.lights.userData.heads.forEach((h) => {
        h.material.emissiveIntensity = intensity;
        h.material.color.setHex(lightsOn ? 0xfff4e0 : 0x2c3038);
      });
      amberMat.emissiveIntensity = amber;
      amberMat.color.setHex(lightsOn ? 0xffb24a : 0x3a3228);
      groups.lights.userData.glow.intensity = lightsOn ? 2.2 : 0;
      tailMat.emissiveIntensity = lightsOn ? 1.5 : 0.35;
    }

    function applyDoors() {
      const angle = doorsOpen ? 0.7 : 0;
      groups.doors.userData.hinges.forEach((h) => {
        const target = h.userData.side === 1 ? -angle : angle;
        h.userData.targetY = target;
      });
    }

    function selectFeature(id) {
      selected = id;
      const f = FEATURES.find((item) => item.id === id);
      FEATURES.forEach((item) => {
        item.btn.classList.toggle("active", item.id === id);
        item.el.classList.toggle("active", item.id === id);
      });
      titleEl.textContent = f.name;
      detailName.textContent = f.name;
      detailCopy.textContent = f.copy;
      detailActions.innerHTML = "";
      if (f.action) {
        const b = document.createElement("button");
        b.type = "button";
        const refresh = () => {
          if (f.action.id === "lights") b.textContent = lightsOn ? f.action.labelOff : f.action.labelOn;
          if (f.action.id === "doors") b.textContent = doorsOpen ? f.action.labelOff : f.action.labelOn;
        };
        b.addEventListener("click", () => {
          if (f.action.id === "lights") lightsOn = !lightsOn;
          if (f.action.id === "doors") doorsOpen = !doorsOpen;
          applyLights();
          applyDoors();
          refresh();
        });
        refresh();
        detailActions.appendChild(b);
      }
      const tour = document.createElement("button");
      tour.type = "button";
      tour.className = "ghost";
      tour.textContent = "Next feature";
      tour.addEventListener("click", () => {
        const idx = FEATURES.findIndex((item) => item.id === selected);
        selectFeature(FEATURES[(idx + 1) % FEATURES.length].id);
      });
      detailActions.appendChild(tour);
      flyTo(f.view);
      controls.autoRotate = false;
    }

    function layoutCamera() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      if (w >= 860) camera.setViewOffset(w, h, -160, 0, w, h);
      else camera.clearViewOffset();
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      labelRenderer.setSize(w, h);
    }

    function flyTo(view) {
      camAnim.from.copy(camera.position);
      camAnim.to.set(view.pos[0], view.pos[1], view.pos[2]);
      camAnim.lookFrom.copy(controls.target);
      camAnim.lookTo.set(view.look[0], view.look[1], view.look[2]);
      camAnim.t = 0;
      camAnim.active = true;
    }

    controls.addEventListener("start", () => {
      camAnim.active = false;
      controls.autoRotate = false;
    });

    window.addEventListener("keydown", (e) => {
      const n = Number(e.key);
      if (n >= 1 && n <= FEATURES.length) selectFeature(FEATURES[n - 1].id);
    });

    window.addEventListener("resize", layoutCamera);

    const car = buildCar();
    addStudio();
    layoutCamera();
    attachLabels(car);
    renderList();
    applyLights();
    applyDoors();
    selectFeature("body");
    statusEl.remove();

    const clock = new THREE.Clock();
    function frame() {
      requestAnimationFrame(frame);
      const dt = clock.getDelta();
      const t = clock.elapsedTime;
      wheels.forEach((w) => { w.userData.spin.rotation.x = t * 0.45; });
      groups.doors.userData.hinges.forEach((h) => {
        h.rotation.y = THREE.MathUtils.damp(h.rotation.y, h.userData.targetY || 0, 4, dt);
      });
      if (camAnim.active) {
        camAnim.t = Math.min(1, camAnim.t + dt * 0.85);
        const k = 1 - Math.pow(1 - camAnim.t, 3);
        camera.position.lerpVectors(camAnim.from, camAnim.to, k);
        controls.target.lerpVectors(camAnim.lookFrom, camAnim.lookTo, k);
        if (camAnim.t >= 1) camAnim.active = false;
      }
      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }
    frame();
  </script>
</body>
</html>
